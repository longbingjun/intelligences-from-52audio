name: Update research data

on:
  schedule:
    - cron: "10 1 * * *"
  workflow_dispatch:
    inputs:
      crawl_mode:
        description: Crawl scope
        type: choice
        options: [daily, backfill-2026]
        default: daily
      run_merge_ocr:
        description: Merge cached OCR results into BOM data
        type: boolean
        default: false
      run_identity_repair:
        description: Repair unresolved product identities with DeepSeek
        type: boolean
        default: false
      run_launch_research:
        description: Extract incremental launch-date evidence with DeepSeek
        type: boolean
        default: false
      run_priority_price_lookup:
        description: Run automated lookup for the recent priority queue
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: research-data-update
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Crawl source records
        run: python scripts/crawl_v2.py --mode "${{ inputs.crawl_mode || 'daily' }}"

      - name: Repair product identities
        if: inputs.run_identity_repair == true
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: python scripts/repair_product_identities.py --all --workers 2 --write-overrides

      - name: Build candidates for optional research
        if: inputs.run_launch_research == true || inputs.run_priority_price_lookup == true
        run: python scripts/build_products.py

      - name: Research launch dates incrementally
        if: inputs.run_launch_research == true
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: python scripts/research_launch_dates.py --recent-only --workers 2 --write

      - name: Look up priority prices
        if: inputs.run_priority_price_lookup == true
        run: python scripts/enrich_commerce.py --priority-unpriced --workers 2

      - name: Merge OCR cache
        if: inputs.run_merge_ocr == true
        run: python scripts/merge_ocr.py --all

      - name: Derive canonical products and incremental AI caches
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: python scripts/pipeline.py derive --with-ai

      - name: Commit canonical data changes
        run: |
          git config user.name "intel-bot"
          git config user.email "intel-bot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "chore: update research data [skip ci]"
          git pull --rebase --autostash origin "${{ github.event.repository.default_branch }}"
          git push origin "HEAD:${{ github.event.repository.default_branch }}"
