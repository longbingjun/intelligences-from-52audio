name: Price text pilot (evidence only)

on:
  workflow_dispatch:
  push:
    branches: [agent/price-text-pilot, agent/product-priority-pilot]

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4
      - run: python scripts/run_price_text_pilot.py
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      - uses: actions/upload-artifact@v4
        with:
          name: price-text-pilot-20
          path: scratch_price_research/price_text_pilot_20.json
