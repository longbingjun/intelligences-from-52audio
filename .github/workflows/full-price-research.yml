name: Full traceable price research

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Run one complete exact-SKU official-price pass
        type: choice
        required: true
        default: full
        options: [full]

permissions:
  contents: write

concurrency:
  group: full-price-research
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install research dependencies
        run: pip install requests beautifulsoup4
      - name: Research every identity-safe product without an official price
        run: python scripts/run_price_text_pilot.py --full --workers 3 --write-accepted --checkpoint-every 10
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      - name: Commit verified prices and research ledger
        run: |
          git config user.name "intel-bot"
          git config user.email "intel-bot@users.noreply.github.com"
          git add data/enrich/official/ data/staging/official/ scratch_price_research/price_text_full.json
          git diff --cached --quiet || git commit -m "data: add full traceable price research"
          git pull --rebase origin master
          git push
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: full-price-research-ledger
          path: scratch_price_research/price_text_full.json
          if-no-files-found: warn
